# php2shell - ModSecurity kuralı (savunma-derinliği katmanı, PHP güncellemesinin YERİNİ ALMAZ).
# PoC'nin session.upload_progress callback'ine ulaşmak için kullandığı
# PHP_SESSION_UPLOAD_PROGRESS adlı alanı içeren istekleri engeller. WAF'lar
# multipart'ı PHP'den farklı ayrıştırır: bu ek bir katmandır, gümüş kurşun değil.
SecRequestBodyAccess On
SecRule ARGS_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" \
    "id:1026109618,phase:2,t:none,deny,status:403,log,\
    msg:'php2shell: PHP_SESSION_UPLOAD_PROGRESS alanı engellendi (CVE-2026-109618/109619)'"
# php.ini içinde session.upload_progress.name değerini değiştirdiyseniz
# yukarıda o adı kullanın.
