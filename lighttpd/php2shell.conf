# php2shell (CVE-2026-109618 / CVE-2026-109619) - RESMİ OLMAYAN, GEÇİCİ.
# multipart POST/PUT/PATCH engelle. lighttpd koşulları yol-dışlamasıyla düzgün
# VEYA'lanamaz; bu yüzden yükleme KABUL ETMEYEN sanal sunucu / dizin başına
# uygulayın, global olarak değil. Gerçek çözüm: PHP'yi güncelleyin.
$HTTP["request-method"] =~ "^(POST|PUT|PATCH)$" {
    $REQUEST_HEADER["Content-Type"] =~ "(?i)^\s*multipart/form-data([;,[:space:]]|$)" {
        url.access-deny = ( "" )
    }
}
